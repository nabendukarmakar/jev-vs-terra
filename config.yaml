models:
  jev:
    api_style: systemone
    endpoint: ${TYPESAFE_API_URL}
    api_key_env: TYPESAFE_API_KEY
    model: jev-latest
    headers:
      Authorization: Bearer {{api_key}}
      Content-Type: application/json
    input_tokens_path: usage.input_tokens
    output_tokens_path: usage.output_tokens
    pricing:
      input_per_million: 1.0
      output_per_million: 2.0

  gpt_terra:
    api_style: chat_completions
    endpoint: ${OPENAI_API_URL}/chat/completions
    api_key_env: OPENAI_API_KEY
    model: gpt-5.6-terra
    headers:
      Authorization: Bearer {{api_key}}
      Content-Type: application/json
    request_template:
      model: "{{model}}"
      messages:
        - role: system
          content: Respond with valid JSON only. Do not include markdown or explanation.
        - role: user
          content: "{{prompt}}"
      max_completion_tokens: 256
    response_path: choices.0.message.content
    input_tokens_path: usage.prompt_tokens
    output_tokens_path: usage.completion_tokens
    pricing:
      input_per_million: 3.0
      output_per_million: 6.0

benchmarks:
  - intent
  - entity
  - judge

tests_file: tests.yaml

results_dir: results

enabled_models:
  - jev
  - gpt_terra
